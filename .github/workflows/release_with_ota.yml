name: Release (Android + Desktop)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create .env
        shell: bash
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> .env
          echo "OPEN_AI_KEY=${{ secrets.OPEN_AI_KEY }}" >> .env

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        shell: bash
        run: |
          chmod +x gradlew
          sed -i 's/\r$//' gradlew

      - name: Decode keystore
        shell: bash
        run: |
          mkdir -p keystore
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > keystore/release.jks
          ls -la keystore

      - name: Build Release APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/keystore/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :composeApp:assembleRelease

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p dist
          echo "Searching for APK..."
          find . -type f -path "*/build/outputs/apk/*/*release*.apk" -print || true
          echo "Copying to dist/ ..."
          find . -type f -path "*/build/outputs/apk/*/*release*.apk" -exec cp -v {} dist/ \; || true
          echo "Collected files:"
          ls -la dist || true

      - name: Rename APK for GitHub Release
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          VERSION="${TAG#v}"   # v1.0.810 -> 1.0.810
          ls -la dist || true

          APK_COUNT=$(ls -1 dist/*.apk 2>/dev/null | wc -l | tr -d ' ')
          if [ "${APK_COUNT}" -eq 0 ]; then
            echo "No APK found in dist/"
            exit 1
          fi

          APK_PATH="$(ls -1 dist/*.apk | head -n 1)"
          NEW_NAME="VCC.Administrator-${VERSION}.apk"

          echo "Renaming ${APK_PATH} -> dist/${NEW_NAME}"
          mv -f "${APK_PATH}" "dist/${NEW_NAME}"

          echo "Result:"
          ls -la dist

      - name: SHA256 (debug)
        shell: bash
        run: |
          (cd dist && sha256sum *.apk) | tee sha256sums.txt || true
          echo "SHA256:"
          cat sha256sums.txt || true

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist/*
          if-no-files-found: error

  desktop:
    name: Build Desktop packages (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create .env
        shell: bash
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> .env
          echo "OPEN_AI_KEY=${{ secrets.OPEN_AI_KEY }}" >> .env

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable (macOS/Linux)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          chmod +x gradlew
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            sed -i '' $'s/\r$//' gradlew
          else
            sed -i 's/\r$//' gradlew
          fi

      - name: Build DMG (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: ./gradlew :composeApp:packageReleaseDmg

      - name: Build MSI (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: .\gradlew.bat :composeApp:packageReleaseMsi

      - name: Build DEB (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: ./gradlew :composeApp:packageReleaseDeb

      - name: Collect packages (macOS/Linux)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist
          echo "Searching for packages inside composeApp..."
          find composeApp -type f \( -name "*.dmg" -o -name "*.deb" -o -name "*.pkg" \) -print || true
          echo "Copying to dist/ ..."
          find composeApp -type f \( -name "*.dmg" -o -name "*.deb" -o -name "*.pkg" \) -exec cp -v {} dist/ \; || true
          echo "Collected files:"
          ls -la dist || true

      - name: Collect packages (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Write-Host "Searching for packages inside composeApp..."
          Get-ChildItem -Path composeApp -Recurse -File -Include *.msi,*.exe | ForEach-Object {
            Write-Host $_.FullName
            Copy-Item $_.FullName -Destination dist -Force
          }
          Write-Host "Collected files:"
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: dist/*
          if-no-files-found: warn

  release:
    name: Publish GitHub Release + update manifest + write Supabase row
    needs: [android, desktop]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout default branch (for committing update.json)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Fetch tags
        shell: bash
        run: |
          git fetch --tags --force

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Show downloaded files (debug)
        shell: bash
        run: |
          echo "Downloaded artifacts:"
          find dist -type f -print || true

      - name: Generate release notes (release_notes.md)
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          PREV_TAG="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          echo "Current tag: ${TAG}"
          echo "Prev tag: ${PREV_TAG}"
          echo "# ${TAG}" > release_notes.md
          echo "" >> release_notes.md
          echo "Changes" >> release_notes.md
          echo "" >> release_notes.md
          git log --pretty=format:"- %s (%h)" "${TAG}" >> release_notes.md
          echo "Release notes:"
          cat release_notes.md

      - name: Upload to GitHub Release (assets + notes)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          make_latest: true
          body_path: release_notes.md
          files: |
            dist/**/*.apk
            dist/**/*.dmg
            dist/**/*.msi
            dist/**/*.deb
            dist/**/*.pkg
          fail_on_unmatched_files: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install supabase

      - name: Fetch release metadata (release.json)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/${REPO}/releases/tags/${TAG}" > release.json
          jq '.tag_name, .published_at, (.assets|length), (.body|length)' release.json

      - name: Generate composeApp/ota/update.json + update/insert Supabase admin_app_updates
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python - <<'PY'
          import os, json, re, pathlib, hashlib
          from datetime import datetime, timezone
          import tomllib
          from supabase import create_client

          dist_root = pathlib.Path("dist")

          def sha256_file(p: pathlib.Path) -> str:
            h = hashlib.sha256()
            with p.open("rb") as f:
              for chunk in iter(lambda: f.read(1024 * 1024), b""):
                h.update(chunk)
            return h.hexdigest()

          def find_local_asset(asset_name: str | None, asset_size: int | None) -> pathlib.Path | None:
            if not dist_root.exists():
              return None
            if asset_name:
              for p in dist_root.rglob(asset_name):
                if p.is_file():
                  return p
            if asset_name and asset_size:
              ext = pathlib.Path(asset_name).suffix.lower()
              for p in dist_root.rglob(f"*{ext}"):
                if p.is_file() and p.stat().st_size == asset_size:
                  return p
            return None

          def pick_asset(assets: list[dict], regex: str) -> dict | None:
            rx = re.compile(regex, re.I)
            for a in assets:
              name = a.get("name","")
              if not rx.search(name):
                continue

              size = a.get("size")
              url = a.get("browser_download_url")

              local = find_local_asset(name, size)
              if not local:
                raise SystemExit(f"ERROR: local file for asset not found in dist/: {name} (size={size})")

              sha = sha256_file(local)
              if not sha:
                raise SystemExit(f"ERROR: sha256 empty for asset: {name}")

              return {
                "name": name,
                "url": url,
                "size": size,
                "sha256": sha,
              }
            return None

          # ВЕРСІЯ (якщо хочеш — можеш брати з TAG, але ти вже маєш libs.versions.toml)
          toml_path = pathlib.Path("gradle/libs.versions.toml")
          data = tomllib.loads(toml_path.read_text(encoding="utf-8"))
          v = data.get("versions", {})

          major = int(v["major"])
          minor = int(v["minor"])
          patch = int(v["patch"])
          subpath = int(v["subpath"])

          desktop_build = patch * 100 + subpath
          version = f"{major}.{minor}.{desktop_build}"

          rel = json.loads(pathlib.Path("release.json").read_text(encoding="utf-8"))
          assets = rel.get("assets", [])
          release_notes = rel.get("body") or ""

          # published_at з GitHub -> epoch millis (bigint)
          published_iso = rel.get("published_at")
          if not published_iso:
            raise SystemExit("ERROR: release.published_at is missing")
          # приклад: 2026-02-15T12:34:56Z
          dt = datetime.fromisoformat(published_iso.replace("Z", "+00:00")).astimezone(timezone.utc)
          published_at_ms = int(dt.timestamp() * 1000)

          windows = pick_asset(assets, r"\.msi$")
          macos   = pick_asset(assets, r"\.(dmg|pkg)$")
          linux   = pick_asset(assets, r"\.deb$")
          android = pick_asset(assets, r"\.apk$")

          # JSON для клієнта/дебагу: 1:1 як таблиця admin_app_updates
          manifest = {
            "version": version,
            "published_at": published_at_ms,
            "release_notes": release_notes,
            "windows": windows,
            "macos": macos,
            "linux": linux,
            "android": android,
          }

          out_path = pathlib.Path("composeApp/ota/update.json")
          out_path.parent.mkdir(parents=True, exist_ok=True)
          out_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8")
          print("Wrote:", out_path)

          sb_url = os.environ["SUPABASE_URL"]
          sb_key = os.environ["SUPABASE_KEY"]
          supabase = create_client(sb_url, sb_key)

          row = {
            "version": manifest["version"],
            "published_at": manifest["published_at"],
            "release_notes": manifest["release_notes"],
            "windows": manifest["windows"],
            "macos": manifest["macos"],
            "linux": manifest["linux"],
            "android": manifest["android"],
          }

          # "upsert" по version без UNIQUE не працює коректно.
          # Робимо: update де version=...; якщо нічого не оновилось — insert.
          upd = supabase.table("admin_app_updates").update(row).eq("version", row["version"]).execute()
          updated_count = len(upd.data or [])
          if updated_count > 0:
            print(f"Updated rows: {updated_count}")
          else:
            ins = supabase.table("admin_app_updates").insert(row).execute()
            print("Inserted:", ins.data)

          PY

      - name: Commit and push update.json
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add composeApp/ota/update.json
          git commit -m "chore(ota): update manifest for ${{ github.ref_name }}" || echo "No changes to commit"
          git push