name: Release (Android + Desktop)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create .env
        shell: bash
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> .env
          echo "OPEN_AI_KEY=${{ secrets.OPEN_AI_KEY }}" >> .env

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        shell: bash
        run: |
          chmod +x gradlew
          sed -i 's/\r$//' gradlew

      - name: Decode keystore
        shell: bash
        run: |
          mkdir -p keystore
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > keystore/release.jks
          ls -la keystore

      - name: Build Release APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/keystore/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :composeApp:assembleRelease

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p dist
          echo "Searching for APK..."
          find . -type f -path "*/build/outputs/apk/*/*release*.apk" -print || true
          echo "Copying to dist/ ..."
          find . -type f -path "*/build/outputs/apk/*/*release*.apk" -exec cp -v {} dist/ \; || true
          echo "Collected files:"
          ls -la dist || true

      - name: SHA256 (debug)
        shell: bash
        run: |
          (cd dist && sha256sum *.apk) | tee sha256sums.txt || true
          echo "SHA256:"
          cat sha256sums.txt || true

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist/*
          if-no-files-found: error

  desktop:
    name: Build Desktop packages (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create .env
        shell: bash
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> .env
          echo "OPEN_AI_KEY=${{ secrets.OPEN_AI_KEY }}" >> .env

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable (macOS/Linux)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          chmod +x gradlew
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            sed -i '' $'s/\r$//' gradlew
          else
            sed -i 's/\r$//' gradlew
          fi

      - name: Build DMG (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: ./gradlew :composeApp:packageReleaseDmg

      - name: Build MSI (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: .\gradlew.bat :composeApp:packageReleaseMsi

      - name: Build DEB (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: ./gradlew :composeApp:packageReleaseDeb

      - name: Collect packages (macOS/Linux)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist
          echo "Searching for packages inside composeApp..."
          find composeApp -type f \( -name "*.dmg" -o -name "*.deb" -o -name "*.pkg" \) -print || true
          echo "Copying to dist/ ..."
          find composeApp -type f \( -name "*.dmg" -o -name "*.deb" -o -name "*.pkg" \) -exec cp -v {} dist/ \; || true
          echo "Collected files:"
          ls -la dist || true

      - name: Collect packages (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Write-Host "Searching for packages inside composeApp..."
          Get-ChildItem -Path composeApp -Recurse -File -Include *.msi,*.exe | ForEach-Object {
            Write-Host $_.FullName
            Copy-Item $_.FullName -Destination dist -Force
          }
          Write-Host "Collected files:"
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: dist/*
          if-no-files-found: warn

  release:
    name: Publish GitHub Release + update manifest + upsert Supabase
    needs: [android, desktop]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout default branch (for committing update.json)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Fetch tags
        shell: bash
        run: |
          git fetch --tags --force

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Show downloaded files (debug)
        shell: bash
        run: |
          echo "Downloaded artifacts:"
          find dist -type f -print || true

      # ---- Generate release notes (опис змін) ----
      - name: Generate release notes (release_notes.md)
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          # знайдемо попередній тег; якщо його нема — беремо всю історію
          PREV_TAG="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          echo "Current tag: ${TAG}"
          echo "Prev tag: ${PREV_TAG}"

          echo "# ${TAG}" > release_notes.md
          echo "" >> release_notes.md

          if [ -n "${PREV_TAG}" ]; then
            echo "## Changes since ${PREV_TAG}" >> release_notes.md
            echo "" >> release_notes.md
            git log --pretty=format:"- %s (%h)" "${PREV_TAG}..${TAG}" >> release_notes.md
          else
            echo "## Changes" >> release_notes.md
            echo "" >> release_notes.md
            git log --pretty=format:"- %s (%h)" "${TAG}" >> release_notes.md
          fi

          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "Generated automatically from git log." >> release_notes.md

          echo "Release notes:"
          cat release_notes.md

      # ---- Create/Update GitHub Release + attach assets + body ----
      - name: Upload to GitHub Release (assets + notes)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          make_latest: true
          body_path: release_notes.md
          files: |
            dist/**/*.apk
            dist/**/*.dmg
            dist/**/*.msi
            dist/**/*.deb
            dist/**/*.pkg
            dist/**/*.exe
          fail_on_unmatched_files: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install supabase

      - name: Fetch release metadata (release.json)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/${REPO}/releases/tags/${TAG}" > release.json
          jq '.tag_name, .published_at, (.assets|length), (.body|length)' release.json

      - name: Generate manifest + write composeApp/ota/update.json + upsert Supabase
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python - <<'PY'
          import os, json, re, pathlib, hashlib
          import tomllib
          from supabase import create_client

          dist_root = pathlib.Path("dist")

          def sha256_file(p: pathlib.Path) -> str:
            h = hashlib.sha256()
            with p.open("rb") as f:
              for chunk in iter(lambda: f.read(1024 * 1024), b""):
                h.update(chunk)
            return h.hexdigest()

          def find_local_asset(asset_name: str | None, asset_size: int | None) -> pathlib.Path | None:
            if not dist_root.exists():
              return None
            if asset_name:
              for p in dist_root.rglob(asset_name):
                if p.is_file():
                  return p
            if asset_name and asset_size:
              ext = pathlib.Path(asset_name).suffix.lower()
              for p in dist_root.rglob(f"*{ext}"):
                if p.is_file() and p.stat().st_size == asset_size:
                  return p
            return None

          def pick_asset(assets: list[dict], regex: str) -> dict | None:
            rx = re.compile(regex, re.I)
            for a in assets:
              name = a.get("name","")
              if rx.search(name):
                size = a.get("size")
                local = find_local_asset(name, size)
                return {
                  "name": name,
                  "url": a.get("browser_download_url"),
                  "size": size,
                  "sha256": sha256_file(local) if local else ""
                }
            return None

          # versions from libs.versions.toml
          toml_path = pathlib.Path("gradle/libs.versions.toml")
          data = tomllib.loads(toml_path.read_text(encoding="utf-8"))
          v = data.get("versions", {})

          major = int(v["major"])
          minor = int(v["minor"])
          patch = int(v["patch"])
          subpath = int(v["subpath"])

          desktop_build = patch * 100 + subpath
          version_name = f"{major}.{minor}.{desktop_build}"
          desktop_version = f"{major}.{minor}.{desktop_build}"

          # android version code (простий стабільний формат)
          android_version = version_name
          android_version_code = major * 1000 + minor * 100 + patch * 10 + subpath

          rel = json.loads(pathlib.Path("release.json").read_text(encoding="utf-8"))
          assets = rel.get("assets", [])

          release_notes = rel.get("body") or ""

          manifest = {
            "tag": rel.get("tag_name"),
            "publishedAt": rel.get("published_at"),
            "versionName": version_name,
            "desktop_version": desktop_version,
            "android_version": android_version,
            "android_version_code": android_version_code,
            "releaseNotes": release_notes,
            "assets": {
              "android": pick_asset(assets, r"\.apk$"),
              "windows": pick_asset(assets, r"\.(msi|exe)$"),
              "macos":   pick_asset(assets, r"\.(dmg|pkg)$"),
              "linux":   pick_asset(assets, r"\.deb$")
            }
          }

          out_path = pathlib.Path("composeApp/ota/update.json")
          out_path.parent.mkdir(parents=True, exist_ok=True)
          out_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8")
          print("Wrote:", out_path)

          sb_url = os.environ["SUPABASE_URL"]
          sb_key = os.environ["SUPABASE_KEY"]
          supabase = create_client(sb_url, sb_key)

          row = {
            "tag": manifest["tag"],
            "published_at": manifest.get("publishedAt"),
            "version_name": manifest.get("versionName"),
            "desktop_version": manifest.get("desktop_version"),
            "android_version": manifest.get("android_version"),
            "android_version_code": manifest.get("android_version_code"),
            "release_notes": manifest.get("releaseNotes"),
            "manifest": manifest,
          }

          res = supabase.table("admin_app_updates").upsert(row).execute()
          print("Upsert result:", res.data)
          PY

      - name: Commit and push update.json
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add composeApp/ota/update.json
          git commit -m "chore(ota): update manifest for ${{ github.ref_name }}" || echo "No changes to commit"
          git push
