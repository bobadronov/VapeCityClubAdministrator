name: Android CI (Release APK)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create .env
        shell: bash
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> .env
          echo "OPEN_AI_KEY=${{ secrets.OPEN_AI_KEY }}" >> .env

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        shell: bash
        run: |
          chmod +x gradlew
          sed -i 's/\r$//' gradlew

      # --- Signing (release) ---
      # Секрети, які треба додати в repo settings:
      # ANDROID_KEYSTORE_BASE64  (base64 від .jks)
      # ANDROID_KEYSTORE_PASSWORD
      # ANDROID_KEY_ALIAS
      # ANDROID_KEY_PASSWORD
      - name: Decode keystore
        shell: bash
        run: |
          mkdir -p keystore
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > keystore/release.jks
          ls -la keystore

      # --- Build Release APK ---
      - name: Build Release APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/keystore/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :composeApp:assembleRelease

      # --- Collect APK into dist/ ---
      - name: Collect APK
        shell: bash
        run: |
          mkdir -p dist
          echo "Searching for APK..."
          find . -type f -path "*/build/outputs/apk/*/*release*.apk" -print || true
          echo "Copying to dist/ ..."
          find . -type f -path "*/build/outputs/apk/*/*release*.apk" -exec cp -v {} dist/ \; || true
          echo "Collected files:"
          ls -la dist || true

      - name: SHA256 (debug)
        shell: bash
        run: |
          (cd dist && sha256sum *.apk) | tee sha256sums.txt || true
          echo "SHA256:"
          cat sha256sums.txt || true

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: dist/*
          if-no-files-found: error

      # --- Attach to GitHub Release for this tag ---
      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          make_latest: true
          files: |
            dist/**/*.apk
          fail_on_unmatched_files: false
