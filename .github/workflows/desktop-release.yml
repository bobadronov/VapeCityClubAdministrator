name: Desktop packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # щоб теги/історія точно були доступні

      - name: Create .env
        shell: bash
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> .env

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # macOS -> DMG
      - name: Make Gradle wrapper executable (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          chmod +x gradlew
          sed -i '' $'s/\r$//' gradlew

      - name: Build DMG (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: ./gradlew :composeApp:packageReleaseDmg

      # Windows -> MSI
      - name: Build MSI (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: .\gradlew.bat :composeApp:packageReleaseMsi

      # Linux -> DEB
      - name: Make Gradle wrapper executable (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          chmod +x gradlew
          sed -i 's/\r$//' gradlew

      - name: Build DEB (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: ./gradlew :composeApp:packageReleaseDeb

      # ✅ Завжди зберігаємо outputs у workflow artifacts
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-packages
          path: |
            composeApp/release_desktop/**/*.dmg
            composeApp/release_desktop/**/*.msi
            composeApp/release_desktop/**/*.deb
            # fallback (на випадок якщо outputBaseDir не спрацював як очікувалось)
            composeApp/build/**/**/*.dmg
            composeApp/build/**/**/*.msi
            composeApp/build/**/**/*.deb
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Show downloaded files (debug)
        run: |
          echo "Downloaded artifacts:"
          find dist -type f

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.dmg
            dist/**/*.msi
            dist/**/*.deb
          fail_on_unmatched_files: false
