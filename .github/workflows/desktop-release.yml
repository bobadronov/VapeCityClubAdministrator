name: Desktop packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.2.3). If empty, a manual tag will be created."
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build packages (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create .env
        shell: bash
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> .env
          echo "OPEN_AI_KEY=${{ secrets.OPEN_AI_KEY }}" >> .env

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable (macOS/Linux)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          chmod +x gradlew
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            sed -i '' $'s/\r$//' gradlew
          else
            sed -i 's/\r$//' gradlew
          fi

      # --- Build per OS ---
      - name: Build DMG (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: ./gradlew :composeApp:packageReleaseDmg

      - name: Build MSI (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: .\gradlew.bat :composeApp:packageReleaseMsi

      - name: Build DEB (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: ./gradlew :composeApp:packageReleaseDeb

      # --- Collect packages into stable folder ---
      - name: Collect packages (macOS/Linux)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist
          echo "Searching for packages inside composeApp..."
          find composeApp -type f \( -name "*.dmg" -o -name "*.deb" -o -name "*.pkg" \) -print || true
          echo "Copying to dist/ ..."
          find composeApp -type f \( -name "*.dmg" -o -name "*.deb" -o -name "*.pkg" \) -exec cp -v {} dist/ \; || true
          echo "Collected files:"
          ls -la dist || true

      - name: Collect packages (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Write-Host "Searching for packages inside composeApp..."
          Get-ChildItem -Path composeApp -Recurse -File -Include *.msi,*.exe | ForEach-Object {
            Write-Host $_.FullName
            Copy-Item $_.FullName -Destination dist -Force
          }
          Write-Host "Collected files:"
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-packages
          path: dist/*
          if-no-files-found: warn

  release:
    name: Publish GitHub Release + update.json
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (needed to create tag + commit update.json)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag name
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            if [ -n "${{ inputs.tag }}" ]; then
              echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
            else
              echo "tag=manual-$(date -u +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT
            fi
          fi
          echo "Using tag: ${{ steps.tag.outputs.tag }}"

      - name: Create tag (only when workflow_dispatch and tag does not exist)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          git fetch --tags

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists. Will publish to existing tag."
            exit 0
          fi

          echo "Creating tag $TAG at current commit..."
          git tag "$TAG"
          git push origin "$TAG"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Show downloaded files (debug)
        run: |
          echo "Downloaded artifacts:"
          find dist -type f -print || true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            dist/**/*.dmg
            dist/**/*.msi
            dist/**/*.deb
            dist/**/*.pkg
            dist/**/*.exe
          fail_on_unmatched_files: false

      # --- NEW: build SHA256 for installers ---
      - name: Build SHA256 map
        shell: bash
        run: |
          find dist -type f \( -name "*.dmg" -o -name "*.msi" -o -name "*.deb" -o -name "*.pkg" -o -name "*.exe" \) -print0 \
            | xargs -0 -I{} sha256sum "{}" > sha256sums.txt || true
          echo "SHA256:"
          cat sha256sums.txt || true

      # --- NEW: generate update.json using libs.versions.toml + GitHub release assets ---
      - name: Generate update.json (libs.versions.toml + release assets)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh api "repos/${REPO}/releases/tags/${TAG}" > release.json

          python - <<'PY'
          import json, re, pathlib
          import tomllib

          # --- read libs.versions.toml ---
          toml_path = pathlib.Path("gradle/libs.versions.toml")
          data = tomllib.loads(toml_path.read_text(encoding="utf-8"))
          v = data.get("versions", {})

          major = int(v["major"])
          minor = int(v["minor"])
          patch = int(v["patch"])
          subpath = int(v["subpath"])

          version_name = f"{major}.{minor}.{patch}"
          windows_build = patch * 100 + subpath
          msi_version = f"{major}.{minor}.{windows_build}"

          # --- sha256 map by filename ---
          sha = {}
          p = pathlib.Path("sha256sums.txt")
          if p.exists():
            for line in p.read_text(encoding="utf-8").splitlines():
              if not line.strip():
                continue
              h, f = line.split(maxsplit=1)
              sha[pathlib.Path(f).name] = h

          # --- release assets ---
          rel = json.load(open("release.json", "r", encoding="utf-8"))
          assets = rel.get("assets", [])

          def pick(regex):
            rx = re.compile(regex, re.I)
            for a in assets:
              name = a.get("name","")
              if rx.search(name):
                return {
                  "name": name,
                  "url": a.get("browser_download_url"),
                  "size": a.get("size"),
                  "sha256": sha.get(name, "")
                }
            return None

          out = {
            "tag": rel.get("tag_name"),
            "publishedAt": rel.get("published_at"),
            "versionName": version_name,
            "windowsBuild": windows_build,
            "msiVersion": msi_version,
            "assets": {
              "windows": pick(r"\.(msi|exe)$"),
              "macos":   pick(r"\.(dmg|pkg)$"),
              "linux":   pick(r"\.deb$")
            }
          }

          pathlib.Path("update.json").write_text(
            json.dumps(out, ensure_ascii=False, indent=2),
            encoding="utf-8"
          )
          print(pathlib.Path("update.json").read_text(encoding="utf-8"))
          PY

      # --- NEW: overwrite update.json in repo root (main branch) ---
      - name: Commit update.json to default branch
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # визначаємо default branch репозиторію (main/master/що завгодно)
          DEFAULT_BRANCH="$(git remote show origin | sed -n 's/.*HEAD branch: //p')"
          if [ -z "$DEFAULT_BRANCH" ]; then
            echo "Failed to detect default branch"
            exit 1
          fi
          echo "Default branch: $DEFAULT_BRANCH"

          git fetch origin "$DEFAULT_BRANCH"
          git checkout "$DEFAULT_BRANCH"

          mv update.json ./update.json
          git add update.json
          git commit -m "chore(update): ${TAG} [skip ci]" || echo "No changes to commit"
          git push origin "$DEFAULT_BRANCH"
