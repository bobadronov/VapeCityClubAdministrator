name: Desktop packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build packages (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create .env
        shell: bash
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> .env
          echo "OPEN_AI_KEY=${{ secrets.OPEN_AI_KEY }}" >> .env

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # --- Gradle wrapper fix for *nix ---
      - name: Make Gradle wrapper executable (macOS/Linux)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          chmod +x gradlew
          # normalize line-endings
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            sed -i '' $'s/\r$//' gradlew
          else
            sed -i 's/\r$//' gradlew
          fi

      # --- Build per OS ---
      - name: Build DMG (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: ./gradlew :composeApp:packageReleaseDmg

      - name: Build MSI (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: .\gradlew.bat :composeApp:packageReleaseMsi

      - name: Build DEB (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: ./gradlew :composeApp:packageReleaseDeb

      # --- Collect packages into a stable folder (dist) ---
      - name: Collect packages (macOS/Linux)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist
          echo "Searching for packages inside composeApp..."
          find composeApp -type f \( -name "*.dmg" -o -name "*.deb" -o -name "*.pkg" \) -print || true
          echo "Copying to dist/ ..."
          find composeApp -type f \( -name "*.dmg" -o -name "*.deb" -o -name "*.pkg" \) -exec cp -v {} dist/ \; || true
          echo "Collected files:"
          ls -la dist || true

      - name: Collect packages (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Write-Host "Searching for packages inside composeApp..."
          Get-ChildItem -Path composeApp -Recurse -File -Include *.msi,*.exe | ForEach-Object {
            Write-Host $_.FullName
            Copy-Item $_.FullName -Destination dist -Force
          }
          Write-Host "Collected files:"
          Get-ChildItem dist | Format-Table Name, Length

      # --- Upload workflow artifacts (always) ---
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-packages
          path: dist/*
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Show downloaded files (debug)
        run: |
          echo "Downloaded artifacts:"
          find dist -type f -maxdepth 3 -print || true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.dmg
            dist/**/*.msi
            dist/**/*.deb
            dist/**/*.pkg
            dist/**/*.exe
          fail_on_unmatched_files: false
