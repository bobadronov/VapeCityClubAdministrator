name: Desktop packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env
        shell: bash
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> .env

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # macOS -> DMG
      - name: Make Gradle wrapper executable (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          chmod +x gradlew
          sed -i '' $'s/\r$//' gradlew

      - name: Build DMG (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: ./gradlew :composeApp:packageReleaseDmg

      # Windows -> MSI
      - name: Build MSI (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: .\gradlew.bat :composeApp:packageReleaseMsi

      # Linux -> DEB
      - name: Make Gradle wrapper executable (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          chmod +x gradlew
          sed -i 's/\r$//' gradlew

      - name: Build DEB (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: ./gradlew :composeApp:packageReleaseDeb

      # (опційно) залишити upload-artifact
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-packages
          path: |
            composeApp/build/compose/binaries/main-release/**/*.dmg
            composeApp/build/compose/binaries/main-release/**/*.msi
            composeApp/build/compose/binaries/main-release/**/*.deb
            composeApp/build/compose/binaries/main-release/**/*.pkg
            composeApp/build/compose/binaries/main-release/**/*.exe
          if-no-files-found: warn

      # ✅ Upload to GitHub Releases (тільки коли це push tag)
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            composeApp/build/compose/binaries/main-release/**/*.dmg
            composeApp/build/compose/binaries/main-release/**/*.msi
            composeApp/build/compose/binaries/main-release/**/*.deb
            composeApp/build/compose/binaries/main-release/**/*.pkg
            composeApp/build/compose/binaries/main-release/**/*.exe
          fail_on_unmatched_files: false
