name: Desktop packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # macOS -> DMG
      - name: Build DMG (macOS)
        if: matrix.os == 'macos-latest'
        run: ./gradlew :composeApp:packageReleaseDmg

      # Windows -> MSI
      - name: Build MSI (Windows)
        if: matrix.os == 'windows-latest'
        run: .\gradlew.bat :composeApp:packageReleaseMsi

      # Linux -> DEB
      - name: Build DEB (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: ./gradlew :composeApp:packageReleaseDeb

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-packages
          path: |
            composeApp/build/compose/binaries/main-release/**/*.dmg
            composeApp/build/compose/binaries/main-release/**/*.msi
            composeApp/build/compose/binaries/main-release/**/*.deb
            composeApp/build/compose/binaries/main-release/**/*.pkg
            composeApp/build/compose/binaries/main-release/**/*.exe
          if-no-files-found: warn
